apiVersion: v1
kind: ConfigMap

metadata:
  name: prometheus-config
  namespace: disaster-response

data:
  prometheus.yml: |
    global:
      scrape_interval: 15s

    scrape_configs:
      - job_name: "backend"

        metrics_path: /actuator/prometheus

        static_configs:
          - targets:
              - "backend:8080"