services:
  postgres:
    image: postgres:17-alpine
    container_name: disaster-response-postgres
    environment:
      POSTGRES_DB: disaster_response
      POSTGRES_USER: disaster_user
      POSTGRES_PASSWORD: disaster_password
    ports:
      - "5433:5432"
    volumes:
      - disaster_response_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U disaster_user -d disaster_response"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: disaster-response-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - disaster_response_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  kafka:
    image: apache/kafka:4.3.1
    container_name: disaster-response-kafka
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://:9091,HOST://:9092,DOCKER://:9093
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9092,DOCKER://kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,HOST:PLAINTEXT,DOCKER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9091
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: disaster-response-backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/disaster_response
      DB_USERNAME: disaster_user
      DB_PASSWORD: disaster_password
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:9093
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    restart: unless-stopped
  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile

    container_name: disaster-response-notification-service

    environment:
      NOTIFICATION_DB_URL: jdbc:postgresql://postgres:5432/notification_service
      DB_USERNAME: disaster_user
      DB_PASSWORD: disaster_password
      KAFKA_BOOTSTRAP_SERVERS: kafka:9093
      SERVER_PORT: 8081

    ports:
      - "8081:8081"

    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started

    restart: unless-stopped

  analytics-service:
    build:
      context: ./analytics-service
      dockerfile: Dockerfile

    container_name: disaster-response-analytics-service

    environment:
      ANALYTICS_DB_URL: jdbc:postgresql://postgres:5432/analytics_service
      DB_USERNAME: disaster_user
      DB_PASSWORD: disaster_password
      KAFKA_BOOTSTRAP_SERVERS: kafka:9093
      SERVER_PORT: 8082

    ports:
      - "8082:8082"

    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started

    restart: unless-stopped

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile

    container_name: disaster-response-api-gateway

    environment:
      BACKEND_URL: http://backend:8080
      BACKEND_WS_URL: ws://backend:8080
      NOTIFICATION_SERVICE_URL: http://notification-service:8081
      ANALYTICS_SERVICE_URL: http://analytics-service:8082
      SERVER_PORT: 8090

    ports:
      - "8090:8090"

    depends_on:
      - backend
      - notification-service
      - analytics-service

    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: disaster-response-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  disaster_response_postgres_data:
  disaster_response_redis_data:
