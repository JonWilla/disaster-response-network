apiVersion: apps/v1
kind: Deployment

metadata:
  name: frontend
  namespace: disaster-response

spec:
  replicas: 1

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:
      containers:
        - name: frontend
          image: disaster-response-network-frontend
          imagePullPolicy: Never

          ports:
            - containerPort: 80