spring:
  application:
    name: disaster-response-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/disaster_response}
    username: ${DB_USERNAME:disaster_user}
    password: ${DB_PASSWORD:disaster_password}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s

  cache:
    type: redis

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

    consumer:
      group-id: disaster-response-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer

      properties:
        spring.json.trusted.packages: com.jonwilla.disasterresponse.event

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

  endpoint:
    health:
      probes:
        enabled: true

security:
  jwt:
    secret: ${JWT_SECRET:VGhpcy1pcy1hLWRldmVsb3BtZW50LWtleS10aGF0LW11c3QtYmUtcmVwbGFjZWQtYmVmb3JlLXByb2R1Y3Rpb24=}
    expiration-ms: 3600000